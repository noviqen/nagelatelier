<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FBF7F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nagelatelier">
<title>Nagelatelier</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="globaldefs"></defs></svg>

<div id="app">
  <header class="top">
    <button class="ic" id="btnGal" aria-label="Mijn designs">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>
    </button>
    <div class="brand">Nagel<em>atelier</em></div>
    <div class="acts">
      <button class="ic" id="btnUndo" aria-label="Ongedaan maken"><svg viewBox="0 0 24 24"><path d="M9 7 4.5 11.5 9 16"/><path d="M5 11.5h9.5a5 5 0 0 1 0 10H12"/></svg></button>
      <button class="ic" id="btnRedo" aria-label="Opnieuw"><svg viewBox="0 0 24 24"><path d="m15 7 4.5 4.5L15 16"/><path d="M19 11.5H9.5a5 5 0 0 0 0 10H12"/></svg></button>
      <button class="ic" id="btnShare" aria-label="Delen"><svg viewBox="0 0 24 24"><path d="M12 3.5v11"/><path d="m7.5 8 4.5-4.5L16.5 8"/><path d="M6 12.5v5a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-5"/></svg></button>
    </div>
  </header>

  <main id="stageWrap">
    <div id="stagefoto"></div>
    <svg id="stage" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="stagebar" id="stagebar">
      <div class="seg" id="viewSeg"><button data-v="hand">Hand</button><button data-v="tips">Alle tien</button></div>
      <button class="pill" id="handSw"></button>
    </div>
    <div class="focusbar" id="focusbar">
      <button class="pill back" id="focusBack"><svg viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></svg>Terug</button>
      <div class="focustitle" id="focusTitle"></div>
      <span></span>
    </div>
    <button class="arrow left" id="prevNail" aria-label="Vorige nagel"><svg viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></svg></button>
    <button class="arrow right" id="nextNail" aria-label="Volgende nagel"><svg viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></svg></button>
    <div class="seg aanzicht" id="aanzichtSeg"><button data-a="boven">Bovenaf</button><button data-a="schuin">Schuin</button><button data-a="toppen">Toppen</button></div>
    <button class="selpill" id="selPill"></button>
    <div class="toast" id="toast"></div>
  </main>

  <section id="panel">
    <div id="panelBody"></div>
    <nav id="tabs">
      <button data-tab="gen"><svg viewBox="0 0 24 24"><path d="M5 19 15.5 8.5"/><path d="m14 7 3 3"/><path d="M18 3.5v3M16.5 5h3M20 11v2M19 12h2M10 3v2M9 4h2"/></svg><span>Genereer</span></button>
      <button data-tab="stappen"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.4"/><circle cx="4.5" cy="12" r="1.4"/><circle cx="4.5" cy="18" r="1.4"/></svg><span>Stappenplan</span></button>
      <button data-tab="aanpassen"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Aanpassen</span></button>
    </nav>
  </section>
</div>

<!-- Galerij -->
<div class="sheet" id="galSheet" aria-hidden="true">
  <div class="sheetcard">
    <div class="sheethead"><h2>Mijn designs</h2><button class="ic" data-close aria-label="Sluiten"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="galacts">
      <button class="btn primary" id="btnSave">Bewaar dit design</button>
      <button class="btn" id="btnNew">Nieuw design</button>
    </div>
    <div class="galgrid" id="galGrid"></div>
  </div>
</div>

<!-- Stappenplan -->
<div class="sheet" id="planSheet" aria-hidden="true">
  <div class="sheetcard plan">
    <div class="sheethead"><h2>Stappenplan</h2><button class="ic" data-close aria-label="Sluiten"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="planbody" id="planBody"></div>
  </div>
</div>

<!-- Delen -->
<div class="sheet" id="shareSheet" aria-hidden="true">
  <div class="sheetcard">
    <div class="sheethead"><h2>Delen</h2><button class="ic" data-close aria-label="Sluiten"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="sharepreview"><img id="shareImg" alt="Je design"></div>
    <div class="galacts">
      <button class="btn primary" id="btnDoShare">Delen</button>
      <a class="btn" id="btnDownload" download="nageldesign.png">Bewaar als foto</a>
    </div>
  </div>
</div>

<div class="ghost" id="ghost"></div>

<script src="data.js?v=2"></script>
<script src="render.js?v=2"></script>
<script src="stappen.js?v=2"></script>
<script src="generator.js?v=2"></script>
<script src="app.js?v=6"></script>
<script src="handfoto.js?v=2"></script>
</body>
</html>
